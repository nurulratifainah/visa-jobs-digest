name: Visa Jobs Digest

on:
  schedule:
    # Monday and Thursday at 00:00 UTC (08:00 Asia/Kuala_Lumpur)
    - cron: "0 0 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run digest agent
        run: npm run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
