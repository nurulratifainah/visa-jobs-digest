name: Claude Agent

# Interactive agent. Mention @claude on an issue or PR (or label an issue
# `agent`) and it works on a branch and opens a PR. That PR then goes through
# CI + AI review + human review like any other.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    # Only repo collaborators can trigger it — a public repo must not let
    # strangers spend the API key or push branches.
    if: |
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'agent'))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                    github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets it read CI logs when asked to fix a failing run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: agent
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 40
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(npm ci:*),Bash(npm test:*),Bash(npm run typecheck:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(git:*)"
